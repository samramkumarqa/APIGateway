server:
  port: 8060
  
eureka:
  client:
    serviceUrl:  # Corrected the key from 'serviveUrl' to 'serviceUrl'
      defaultZone: http://localhost:8761/eureka/
      
management:
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8088"  # Correct placement and syntax
  cloud:
    gateway:
      routes:
        - id: employee-service
          uri: lb://employee-service  # Load balancing through Eureka
          predicates:
            - Path=/employee/**
        - id: department-service
          uri: lb://department-service  # Load balancing through Eureka
          predicates:
            - Path=/department/**